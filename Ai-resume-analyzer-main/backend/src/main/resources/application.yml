spring:
  application:
    name: ai-resume-analyzer

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resume_analyzer}
    username: ${DB_USERNAME:resume_user}
    password: ${DB_PASSWORD:resume_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
    show-sql: false

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:6MB}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:5d7e2a9c1f4b8e3d6a0c9f2b5e8d1a4c7f0b3e6d9a2c5f8b1e4d7a0c3f6b9e2d}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}        # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}   # 7 days
    issuer: ai-resume-analyzer

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  storage:
    location: ${FILE_STORAGE_LOCATION:./storage/resumes}
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:5242880}

  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    timeout-seconds: ${OPENAI_TIMEOUT:60}
    enabled: ${OPENAI_ENABLED:true}

  frontend:
    reset-password-url: ${FRONTEND_RESET_URL:http://localhost:5173/reset-password}

  seed:
    enabled: ${SEED_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.airesume.analyzer: DEBUG
    org.springframework.security: INFO
